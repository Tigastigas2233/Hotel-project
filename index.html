<!DOCTYPE html>
<html>
<head>
    <title>Test CSS</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="cabeca">
        <div class= "fickle">
            <img src="fickle.svg" alt="fickle logo">
        </div>
        <nav>
            <ul class="lista">
                <li><a class= "exp" href="#">Explore</a></li>
                <li><a href="#">Search</a></li>
                <li><a href="#">Hotels</a></li>
                <li><a href="#">Offers</a></li>
            </ul>
            <div class="last">
                <img class="notification" src="notification.png" alt="notification simbol">              
                <img class="icon" src="icon.png" alt="login image">                       
            </div>
        </nav>
    </header>
    <div class="search">
        <div class="title" alt="Title logo">
            <div class="Title1">Let’s explore & travel the world</div>
            <div class="Title2">Find the best destinations and the most popular stays!</div>
        </div>
        <div class="searchF" alt="search bar">
            <div class="S1">
                <div class="searchTitle">Search Flights</div>
                <div class="options">
                    <input type="radio" class="option1">
                    <div class="Return">Return</div>
                    <input type="radio" class="option2">
                    <div class="one-way">One-way</div>
                </div>
            </div>
            <div class="choose" alt="chosse options">
                <div class="box">
                    <input type="search" class="Departure" placeholder="Departure">
                        <a href="#">&#9660;</a>
                    <input type="search" class="Arrival" placeholder="Arrival">
                        <a href="#">&#9660;</a>
                    <input type="search" class="Date" placeholder="Date">
                        <a href="#">&#128197;</a>
                </div>
                <button class="orange button"> Search Flights</button>
    
            </div>
        </div>
        
    </div>
</body>
</html>
